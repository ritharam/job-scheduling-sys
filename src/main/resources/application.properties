spring.application.name=job-scheduler

# ============================================================
# TIMEZONE
# ============================================================
# The application uses India Standard Time for LocalDateTime
# scheduling and logging.
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ============================================================
# SERVER
# ============================================================
server.port=8080

# ============================================================
# POSTGRESQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/job_scheduler
spring.datasource.username=scheduler_user
spring.datasource.password=scheduler_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# REDIS
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ============================================================
# KAFKA
# ============================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=job-worker-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ============================================================
# JOB SCHEDULER
# ============================================================
# Poll PostgreSQL every second for jobs whose scheduledAt has arrived.
job.scheduler.poll-interval-ms=1000

# Worker identifier. Override with:
# -Djob.worker.id=worker-1
# or an environment-specific configuration.
job.worker.id=worker-1
